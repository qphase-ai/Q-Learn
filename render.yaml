# Render Blueprint (Infrastructure as Code) for Q-Learn.
# Docs: https://render.com/docs/blueprint-spec
#
# - Auto-deploys the latest commit on `main` (autoDeploy: true).
# - Opens a preview environment for every PR (previews.generation: automatic).
# - Secrets live in the `qlearn-secrets` env group (set once in the dashboard);
#   env groups ARE inherited by preview environments, unlike per-service
#   `sync: false` vars which are not.

previews:
  generation: automatic
  expireAfterDays: 3

services:
  - type: web
    name: q-learn-api
    runtime: docker
    repo: https://github.com/qphase-ai/Q-Learn
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: SUPABASE_URL
        value: https://gwljzmjsuznwsdnqxxwu.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3bGp6bWpzdXpud3NkbnF4eHd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NTMwMDUsImV4cCI6MjEwNTEyOTAwNX0.CPXjuwSxGDhl69T4h3Rk7APCi0jrVn2sIq7LVq4mzyw
      - key: CORS_ORIGINS
        value: '["https://q-learn-seven.vercel.app","https://q-learn-himanshu-kumars-projects-a15924dd.vercel.app","https://q-learn-git-main-himanshu-kumars-projects-a15924dd.vercel.app"]'
      - key: SECRET_KEY
        generateValue: true
      - fromGroup: qlearn-secrets

envVarGroups:
  # Values are set once in the Render dashboard (never committed). Shared across
  # the main service and all PR preview environments.
  - name: qlearn-secrets
    envVars:
      - key: DATABASE_URL
      - key: SUPABASE_SERVICE_KEY
      - key: SUPABASE_JWT_SECRET
