[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlearn-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # Auth
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "python-jose[cryptography]>=3.3.0",
    # Payments
    "razorpay>=1.4.0",
    # Sandbox
    "vercel-sandbox>=0.1.0",
    # AI / Agents
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "litellm>=1.52.0",
    "supabase>=2.0.0",
    # Observability
    "structlog>=24.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
