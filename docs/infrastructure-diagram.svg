<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <style>
      .tier   { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; rx:14; }
      .tierlbl{ font-size:13px; font-weight:700; fill:#94a3b8; letter-spacing:1.5px; }
      .box    { rx:10; stroke-width:1.5; }
      .title  { font-size:15px; font-weight:700; }
      .sub    { font-size:11.5px; fill:#475569; }
      .edge   { stroke:#64748b; stroke-width:1.6; fill:none; }
      .edgeb  { stroke:#2563eb; stroke-width:1.8; fill:none; }
      .edgeg  { stroke:#059669; stroke-width:1.8; fill:none; }
      .edgea  { stroke:#d97706; stroke-width:1.8; fill:none; }
      .elbl   { font-size:11px; fill:#334155; font-weight:600; }
      .elblbg { fill:#ffffff; opacity:0.9; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1240" height="900" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="46" font-size="26" font-weight="800" fill="#0f172a">Q-Learn — Infrastructure &amp; Data Flow</text>
  <text x="40" y="70" font-size="13.5" fill="#64748b">Three-tier: Presentation (Vercel) → Application (Railway/FastAPI) → Data &amp; Infrastructure (Supabase + Vercel Sandbox)</text>

  <!-- ===================== CLIENT ===================== -->
  <rect x="500" y="96" width="240" height="62" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="620" y="123" text-anchor="middle" class="title" fill="#3730a3">Student Browser</text>
  <text x="620" y="142" text-anchor="middle" class="sub">React IDE shell · Supabase JS SDK</text>

  <!-- ===================== TIER 1: PRESENTATION ===================== -->
  <rect x="40" y="188" width="1160" height="118" class="tier"/>
  <text x="58" y="210" class="tierlbl">PRESENTATION</text>

  <rect x="500" y="222" width="240" height="70" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="620" y="249" text-anchor="middle" class="title" fill="#155e75">Vercel — Next.js 14</text>
  <text x="620" y="268" text-anchor="middle" class="sub">App Router · Zustand stores</text>
  <text x="620" y="284" text-anchor="middle" class="sub">React Flow circuit builder</text>

  <!-- ===================== TIER 2: APPLICATION ===================== -->
  <rect x="40" y="336" width="1160" height="150" class="tier"/>
  <text x="58" y="358" class="tierlbl">APPLICATION</text>

  <rect x="430" y="372" width="380" height="98" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="620" y="398" text-anchor="middle" class="title" fill="#1e40af">Railway — FastAPI (Docker)</text>
  <text x="620" y="417" text-anchor="middle" class="sub">Router → Service → Repository → SQLAlchemy 2.x async</text>
  <text x="620" y="434" text-anchor="middle" class="sub">LangGraph agents · RAG (BM25 + pgvector + RRF + reranker)</text>
  <text x="620" y="451" text-anchor="middle" class="sub">QiskitAerAdapter · publishes Realtime events · uvicorn :8000</text>

  <!-- ===================== TIER 3: DATA & INFRA ===================== -->
  <rect x="40" y="516" width="1160" height="300" class="tier"/>
  <text x="58" y="538" class="tierlbl">DATA &amp; INFRASTRUCTURE</text>

  <!-- Supabase cluster -->
  <rect x="70" y="556" width="470" height="234" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="305" y="582" text-anchor="middle" class="title" fill="#065f46">Supabase Cloud</text>

  <rect x="94" y="598" width="200" height="74" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="194" y="623" text-anchor="middle" class="title" font-size="13.5" fill="#065f46">Auth</text>
  <text x="194" y="641" text-anchor="middle" class="sub">JWT (HS256) issuer</text>
  <text x="194" y="657" text-anchor="middle" class="sub">SUPABASE_JWT_SECRET</text>

  <rect x="318" y="598" width="200" height="74" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="418" y="623" text-anchor="middle" class="title" font-size="13.5" fill="#065f46">Postgres + pgvector</text>
  <text x="418" y="641" text-anchor="middle" class="sub">app data · embeddings(384)</text>
  <text x="418" y="657" text-anchor="middle" class="sub">AsyncPostgresSaver state</text>

  <rect x="94" y="690" width="424" height="72" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="306" y="715" text-anchor="middle" class="title" font-size="13.5" fill="#065f46">Realtime (pub/sub, WebSocket)</text>
  <text x="306" y="733" text-anchor="middle" class="sub">FastAPI publishes → browser subscribes</text>
  <text x="306" y="749" text-anchor="middle" class="sub">circuit results · tutor tokens · progress</text>

  <!-- Vercel Sandbox -->
  <rect x="570" y="556" width="260" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="582" text-anchor="middle" class="title" fill="#92400e">Vercel Sandbox</text>
  <text x="700" y="602" text-anchor="middle" class="sub">AsyncSandbox.fork()</text>
  <text x="700" y="619" text-anchor="middle" class="sub">isolated microVM · deny-all net</text>
  <text x="700" y="636" text-anchor="middle" class="sub">512 MB · 30s · Qiskit + student code</text>
  <text x="700" y="655" text-anchor="middle" class="sub">"qlearn-python-base"</text>

  <!-- External services -->
  <rect x="860" y="556" width="310" height="52" class="box" fill="#faf5ff" stroke="#9333ea"/>
  <text x="1015" y="580" text-anchor="middle" class="title" font-size="13.5" fill="#6b21a8">LLM Provider (ChatLiteLLM)</text>
  <text x="1015" y="597" text-anchor="middle" class="sub">primary + fallbacks · OpenAI / Anthropic / Gemini</text>

  <rect x="860" y="620" width="310" height="46" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1015" y="641" text-anchor="middle" class="title" font-size="13.5" fill="#991b1b">Razorpay</text>
  <text x="1015" y="657" text-anchor="middle" class="sub">freemium + Pro subscriptions</text>

  <!-- CI/CD -->
  <rect x="860" y="690" width="310" height="72" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1015" y="715" text-anchor="middle" class="title" font-size="13.5" fill="#334155">GitHub Actions — CI/CD</text>
  <text x="1015" y="733" text-anchor="middle" class="sub">push to main → deploy</text>
  <text x="1015" y="749" text-anchor="middle" class="sub">Vercel (web) · Railway (api)</text>

  <!-- ===================== EDGES ===================== -->

  <!-- Browser <-> Vercel -->
  <path class="edge" d="M620,158 L620,222" marker-end="url(#arrow)"/>
  <rect class="elblbg" x="628" y="182" width="86" height="16"/>
  <text x="632" y="194" class="elbl">HTTPS (SSR/CSR)</text>

  <!-- Vercel -> Railway (REST) -->
  <path class="edgeb" d="M560,292 C520,330 540,340 560,372" marker-end="url(#arrowBlue)"/>
  <rect class="elblbg" x="430" y="326" width="118" height="16"/>
  <text x="434" y="338" class="elbl" fill="#1e40af">REST · NEXT_PUBLIC_API_URL</text>

  <!-- Browser -> Supabase Auth (direct login) -->
  <path class="edgeg" d="M500,140 C210,150 170,360 194,598" marker-end="url(#arrowGreen)"/>
  <rect class="elblbg" x="120" y="300" width="120" height="16"/>
  <text x="124" y="312" class="elbl" fill="#065f46">Auth login (JS SDK)</text>

  <!-- Browser <- Supabase Realtime (subscribe) -->
  <path class="edgeg" d="M740,150 C1120,160 560,470 430,700" marker-end="url(#arrowGreen)"/>
  <rect class="elblbg" x="812" y="150" width="150" height="16"/>
  <text x="816" y="162" class="elbl" fill="#065f46">subscribe: Realtime (WS)</text>

  <!-- Railway -> Postgres -->
  <path class="edgeg" d="M540,436 C470,470 440,540 418,598" marker-end="url(#arrowGreen)"/>
  <rect class="elblbg" x="430" y="500" width="150" height="16"/>
  <text x="434" y="512" class="elbl" fill="#065f46">asyncpg :6543 (pooler)</text>

  <!-- Railway -> Auth (verify JWT) -->
  <path class="edgeg" d="M470,450 C320,490 250,540 210,598" marker-end="url(#arrowGreen)"/>
  <rect class="elblbg" x="238" y="512" width="120" height="16"/>
  <text x="242" y="524" class="elbl" fill="#065f46">verify JWT (HS256)</text>

  <!-- Railway -> Realtime (publish) -->
  <path class="edgeg" d="M560,462 C430,500 360,600 330,690" marker-end="url(#arrowGreen)"/>
  <rect class="elblbg" x="345" y="560" width="118" height="16"/>
  <text x="349" y="572" class="elbl" fill="#065f46">publish events</text>

  <!-- Railway -> Sandbox -->
  <path class="edgea" d="M700,470 L700,556" marker-end="url(#arrowAmber)"/>
  <rect class="elblbg" x="708" y="505" width="112" height="16"/>
  <text x="712" y="517" class="elbl" fill="#92400e">fork() quantum/code</text>

  <!-- Railway -> LLM -->
  <path class="edge" d="M810,410 C900,430 950,510 1000,556" marker-end="url(#arrow)"/>
  <rect class="elblbg" x="872" y="470" width="96" height="16"/>
  <text x="876" y="482" class="elbl">agent LLM calls</text>

  <!-- Railway -> Razorpay -->
  <path class="edge" d="M810,440 C930,480 960,570 980,620" marker-end="url(#arrow)"/>
  <rect class="elblbg" x="828" y="527" width="86" height="16"/>
  <text x="832" y="539" class="elbl">payments API</text>

  <!-- CI/CD deploy arrows -->
  <path class="edge" d="M900,690 C820,610 760,360 720,292" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <path class="edge" d="M960,690 C820,600 700,510 700,470" marker-end="url(#arrow)" stroke-dasharray="5 4"/>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="836" width="1160" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="70"  y1="858" x2="108" y2="858" class="edgeb"/>
  <text x="116" y="862" class="sub">REST (HTTPS)</text>
  <line x1="240" y1="858" x2="278" y2="858" class="edgeg"/>
  <text x="286" y="862" class="sub">Supabase (Postgres · Auth · Realtime)</text>
  <line x1="560" y1="858" x2="598" y2="858" class="edgea"/>
  <text x="606" y="862" class="sub">Sandbox fork (isolated exec)</text>
  <line x1="820" y1="858" x2="858" y2="858" class="edge"/>
  <text x="866" y="862" class="sub">External API (LLM · Razorpay)</text>
  <line x1="1030" y1="858" x2="1068" y2="858" class="edge" stroke-dasharray="5 4"/>
  <text x="1076" y="862" class="sub">CI/CD deploy</text>
</svg>
