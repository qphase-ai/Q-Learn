name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qlearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qlearn_test
          SECRET_KEY: test-secret-key-for-ci
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_JWT_SECRET: placeholder-jwt-secret
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qlearn_test
          SECRET_KEY: test-secret-key-for-ci
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_JWT_SECRET: placeholder-jwt-secret
          # Unbuffered: a prior run produced zero output for 57 minutes before
          # being cancelled, which made a genuine hang indistinguishable from
          # a slow-but-progressing run with output stuck in Python's default
          # block buffering on a non-TTY pipe. This makes that diagnosable.
          PYTHONUNBUFFERED: "1"
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  deploy-backend:
    name: Deploy backend (InstaCloud)
    # Only a push to main ships, and only after the backend tests pass.
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never run two deploys of the same service at once; queue instead of cancelling,
    # so a deploy that has started always finishes.
    concurrency:
      group: deploy-backend-instacloud
      cancel-in-progress: false
    env:
      INSTA_PROJECT_ID: ed2f5dfe-9171-4268-9e94-3dcb6ea0ddbf
      INSTA_ORG_ID: 8aa588d9-e4ad-4ddb-95d6-bb4f27ce5533
      INSTA_BRANCH: main
      API_URL: https://prod-main-api-e7ab8e-008pmc86yhk.compute.instacloud-edge.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install insta CLI
        run: |
          npm install -g insta@0.1.25
          insta --version

      - name: Log in to InstaCloud
        env:
          INSTA_API_KEY: ${{ secrets.INSTA_API_KEY }}
        run: |
          if [ -z "$INSTA_API_KEY" ]; then
            echo "::error::INSTA_API_KEY secret is not set (see docs/infrastructure.md#ci-deploy)"
            exit 1
          fi
          insta login --api-key "$INSTA_API_KEY"
          insta status

      # The checkout holds only committed files, so no local .env* reaches the image.
      # The container runs `alembic upgrade head` on boot, so this also applies
      # pending migrations to the production (Supabase) database.
      - name: Deploy backend
        run: insta deploy backend --branch main --group api --port 8000

      - name: Verify /health
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "$API_URL/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              curl -s "$API_URL/health"; echo
              exit 0
            fi
            sleep 6
          done
          echo "::error::$API_URL/health did not return 200 after the deploy"
          insta compute logs api --branch main --limit 100 || true
          exit 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm type-check

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: pnpm build

  cms:
    name: CMS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install deps
        working-directory: cms
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: cms
        run: pnpm type-check

      - name: Lint
        working-directory: cms
        run: pnpm lint

      - name: Test
        working-directory: cms
        run: pnpm test
